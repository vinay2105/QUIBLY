{% extends 'base.html' %}
{% block title %}Login - Quibly{% endblock %}

{% block content %}
<style>
  .auth-container {
    max-width: 420px;
    margin: 3rem auto;
    background: rgba(31,31,35,0.95);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    padding: 2rem 1.5rem;
    color: #eaeaea;
    transition: 0.3s;
  }
  .auth-container:hover {
    transform: translateY(-2px);
  }

  .quibly-logo {
    font-size: 2rem;
    font-weight: 700;
    color: #4dabf7;
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .auth-heading {
    text-align: center;
    font-weight: 600;
    margin-bottom: 1.5rem;
    font-size: 1.2rem;
    color: #ffffff;
  }

  .form-label {
    font-weight: 500;
    color: #cccccc;
  }

  .form-control {
    border-radius: 10px;
    background: rgba(43,43,47,0.9);
    border: 1px solid #555;
    color: #ffffff;
    padding: 0.55rem 0.75rem;
  }
  .form-control::placeholder {
    color: #aaaaaa;
  }
  .form-control:focus {
    border-color: #4dabf7;
    box-shadow: 0 0 0 0.15rem rgba(74,173,247,0.25);
  }

  .btn-auth {
    border-radius: 10px;
    padding: 0.55rem 1.5rem;
    font-weight: 600;
    background: linear-gradient(90deg,#4dabf7,#1e90ff);
    border: none;
    color: #fff;
    transition: 0.3s;
  }
  .btn-auth:hover {
    transform: scale(1.03);
    background: linear-gradient(90deg,#74c0fc,#339af0);
  }

  .form-footer {
    text-align: center;
    margin-top: 1rem;
    font-size: 0.9rem;
  }
  .form-footer a {
    text-decoration: none;
    color: #bbbbbb;
    transition: 0.2s;
  }
  .form-footer a:hover {
    text-decoration: underline;
    color: #ffffff;
  }

  .alert {
    font-size: 0.9rem;
    background-color: rgba(74,173,247,0.1);
    color: #ffffff;
    border: 1px solid #4dabf7;
    border-radius: 10px;
  }

  /* Responsive */
  @media (max-width: 576px) {
    .auth-container {
      margin: 2rem 1rem;
      padding: 1.5rem 1rem;
    }
    .btn-auth {
      width: 100%;
    }
  }
</style>

<div class="auth-container">
    <div class="quibly-logo">Quibly</div>
    <div class="auth-heading">Welcome Back</div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-warning my-2">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" name="username" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
        </div>

        <div class="form-footer mb-3">
            <a href="{% url 'forgot_password' %}">Forgot Password?</a>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-auth text-white">Login</button>
        </div>
    </form>

    <div class="form-footer mt-3">
        New to Quibly? <a href="{% url 'register' %}">Register here</a>
    </div>
</div>
{% endblock %}
