{% extends 'base.html' %}
{% block title %}Post Tweet - Quibly{% endblock %}

{% block content %}
<style>
  .post-container {
    max-width: 650px;
    margin: 2rem auto;
    padding: 0 1rem;
  }

  .post-form {
    background: rgba(43,43,47,0.95);
    backdrop-filter: blur(8px);
    color: #ffffff;
    border-radius: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    padding: 2rem 1.5rem;
    transition: 0.3s;
  }
  .post-form:hover {
    transform: translateY(-2px);
  }

  .post-form label {
    color: #ccc;
    font-weight: 500;
    margin-bottom: 0.3rem;
    display: block;
  }

  .post-form .form-control {
    background-color: rgba(31,31,35,0.9);
    border: 1px solid #444;
    color: #e6e6e6;
    border-radius: 10px;
    padding: 0.6rem 0.75rem;
    caret-color: #fff;
  }
  .post-form .form-control:focus {
    border-color: #4dabf7;
    box-shadow: 0 0 0 0.15rem rgba(74,173,247,0.25);
  }
  .post-form .form-control::placeholder {
    color: #aaaaaa;
  }

  .btn-tweet {
    background: linear-gradient(90deg,#4dabf7,#1e90ff);
    color: #fff;
    font-weight: 600;
    padding: 0.55rem 1.6rem;
    font-size: 0.95rem;
    border-radius: 10px;
    border: none;
    transition: 0.3s;
  }
  .btn-tweet:hover {
    transform: scale(1.03);
    background: linear-gradient(90deg,#74c0fc,#339af0);
    color: #fff;
  }

  h2 {
    color: #ffffff;
    text-align: center;
    margin-bottom: 1.5rem;
    font-weight: 700;
  }

  #imagePreview {
    max-width: 100%;
    max-height: 280px;
    border-radius: 12px;
    margin-top: 1rem;
    display: none;
  }

  /* Responsive */
  @media (max-width: 576px) {
    .post-form {
      padding: 1.5rem 1rem;
    }
    .btn-tweet {
      width: 100%;
    }
  }
</style>

<div class="post-container">
    <h2>Post a Tweet</h2>

    <form method="POST" enctype="multipart/form-data" class="post-form">
        {% csrf_token %}
        
        <div class="mb-3">
            {{ form.content.label_tag }}
            {{ form.content }}
        </div>

        <div class="mb-3">
            {{ form.caption.label_tag }}
            {{ form.caption }}
        </div>

        <div class="mb-3">
            {{ form.image.label_tag }}
            {{ form.image }}
            <img id="imagePreview" />
        </div>

        <div class="text-center mt-3">
          <button type="submit" class="btn btn-tweet">Tweet</button>
        </div>
    </form>
</div>

<script>
document.getElementById("id_image").addEventListener("change", function(event) {
    const file = event.target.files[0];
    const preview = document.getElementById("imagePreview");

    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    } else {
        preview.style.display = "none";
    }
});
</script>
{% endblock %}
